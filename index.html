<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>Leb - Filo & Sürücü Takip</title>
  <meta name="description" content="Filo ve sürücüleriniz için muayene, vize ve ehliyet süreleri takip sistemi.">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Leb">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png?v=3.6.0">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png?v=3.6.0">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.webmanifest?v=3.6.0">

  <!-- Favicon & Theme Color -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png?v=3.9.0">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3.9.0">
  <meta name="theme-color" content="#F8F9FA">

  <!-- Stylesheet (Leb v4.8.0) -->
  <link rel="stylesheet" href="css/app.css?v=4.8.0">
</head>
<body>

  <!-- Top Minimal Centered Header (Safe Spacing from iOS Status Bar) -->
  <header class="leb-header" id="mainHeader">
    <div class="leb-header-inner">
      <!-- Perfectly Centered: Large Logo & Bold Leb Title -->
      <div class="brand-centered">
        <img src="icons/header-logo.svg?v=3.8.0" alt="Leb Logo" class="brand-avatar-img">
        <h1 class="brand-main">Leb</h1>
      </div>

      <!-- Desktop Admin Action (Desktop Only, Completely Hidden on Mobile) -->
      <div class="desktop-admin-bar">
        <button id="btnExportExcel" class="leb-btn leb-btn-secondary export-btn" title="Excel formatında (CSV) tüm kayıtları indir">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Excel'e Aktar</span>
        </button>
        <button id="openAddModalBtn" class="leb-btn leb-btn-primary add-btn" title="Yeni Kayıt Ekle">
          <span class="plus-icon">+</span>
          <span id="addBtnLabel">Yeni Ekle</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="leb-main">

    <!-- PRIMARY SEGMENTED TABS: Araçlar vs Sürücüler (Smooth Switch) -->
    <section class="leb-segmented-wrapper">
      <div class="leb-segmented-track" role="tablist">
        <button id="tabVehicles" class="leb-seg-btn active" role="tab" aria-selected="true" data-section="vehicles">
          <span class="seg-text">Araçlar</span>
          <span id="badgeVehiclesCount" class="leb-counter-pill">0</span>
        </button>
        <button id="tabDrivers" class="leb-seg-btn" role="tab" aria-selected="false" data-section="drivers">
          <span class="seg-text">Sürücüler</span>
          <span id="badgeDriversCount" class="leb-counter-pill">0</span>
        </button>
      </div>
    </section>

    <!-- Stat Metric Strip (Clean, Modern, No (<7G) clutter) -->
    <section class="leb-stats-strip">
      <div class="leb-stat-card stat-total active-stat" data-filter="all">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-title">Toplam</span>
      </div>
      <div class="leb-stat-card stat-critical" data-filter="critical">
        <span class="stat-num stat-num-critical" id="statCritical">0</span>
        <span class="stat-title"><span class="dot-indicator dot-critical"></span> Kritik</span>
      </div>
      <div class="leb-stat-card stat-warning" data-filter="warning">
        <span class="stat-num stat-num-warning" id="statWarning">0</span>
        <span class="stat-title"><span class="dot-indicator dot-warning"></span> Yaklaşan</span>
      </div>
      <div class="leb-stat-card stat-safe" data-filter="safe">
        <span class="stat-num stat-num-safe" id="statSafe">0</span>
        <span class="stat-title"><span class="dot-indicator dot-safe"></span> Sorunsuz</span>
      </div>
    </section>

    <!-- Controls Row: Search (Desktop Only) & Centered Sub-Filter Pills -->
    <section class="leb-controls-row">
      <!-- Search Input (Hidden on Mobile) -->
      <div class="leb-search-container">
        <svg class="leb-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Plaka veya isim ara..." autocomplete="off">
        <button id="clearSearchBtn" class="leb-clear-btn" aria-label="Temizle" style="display: none;">&times;</button>
      </div>

      <!-- Centered Sub-Filter Pills -->
      <div id="subFiltersTrack" class="leb-filter-pills" role="tablist">
        <!-- Rendered dynamically by app.js -->
      </div>
    </section>

    <!-- Records Vertical List Container (Alt Alta Sıralı Liste) -->
    <section class="leb-records-container">
      <div id="recordsList" class="leb-list" role="list">
        <!-- Rendered dynamically by app.js with smooth transitions -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="leb-empty-card" style="display: none;">
        <h3 class="leb-empty-title">Kayıt Bulunamadı</h3>
        <p class="leb-empty-desc">Bu kriterde görüntülenecek herhangi bir kayıt bulunmuyor.</p>
        <button id="btnResetFilters" class="leb-btn leb-btn-sm leb-btn-secondary">Filtreleri Temizle</button>
      </div>
    </section>

  </main>

  <!-- Quiet Bottom Status Footer -->
  <footer class="leb-footer">
    <div class="leb-footer-inner">
      <div class="sync-bottom-badge" id="bottomSyncBadge">
        <span class="sync-dot" id="syncStatusDot"></span>
        <span id="syncStatusText">Bulutla Eşitlendi</span>
      </div>
      <div class="footer-actions">
        <button id="btnNotifToggle" class="leb-btn-icon notif-bell-btn" title="Bildirim Durumu (15 gün kala ve 7 gün kala sabah 10:00'da uyarı)" aria-label="Bildirim Ayarı">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
        <button id="manualSyncBtn" class="leb-btn-icon" title="Şimdi Eşitle" aria-label="Eşitle">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- DESKTOP-ONLY MODAL: Sade Yeni Kayıt Ekle (Hidden on Mobile) -->
  <div id="addModal" class="leb-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="addModalHeading">
    <div class="leb-modal-box">
      <div class="leb-modal-head">
        <h2 id="addModalHeading" class="leb-modal-title">Yeni Kayıt</h2>
        <button id="closeAddModalBtn" class="leb-close-btn" aria-label="Kapat">&times;</button>
      </div>

      <!-- Simplified Modal Tab Switcher -->
      <div class="modal-tab-track">
        <button type="button" id="modalSwitchVehicle" class="modal-tab-btn active" data-type="vehicle">
          Araç
        </button>
        <button type="button" id="modalSwitchDriver" class="modal-tab-btn" data-type="driver">
          Sürücü
        </button>
      </div>

      <!-- Vehicle Form (Themed & Minimalist) -->
      <form id="vehicleForm" class="leb-form">
        <div class="form-group">
          <label for="inputPlate">Plaka *</label>
          <input type="text" id="inputPlate" placeholder="Örn: 34 LEB 1919" required>
        </div>

        <!-- Themed Segmented Selector for Araç Türü (No Ugly Native Select) -->
        <div class="form-group">
          <label>Araç Türü *</label>
          <div class="type-segment-track" id="vehicleTypeTrack">
            <button type="button" class="type-segment-btn active" data-val="Çekici">Çekici</button>
            <button type="button" class="type-segment-btn" data-val="Dorse">Dorse</button>
            <button type="button" class="type-segment-btn" data-val="Otomobil">Otomobil</button>
          </div>
          <input type="hidden" id="selectVehicleType" value="Çekici">
        </div>

        <div class="form-group">
          <div class="label-with-presets">
            <label for="trigger_inputInspectionDate">Muayene Bitiş Tarihi *</label>
            <div class="chip-presets">
              <button type="button" class="preset-chip" data-target="inputInspectionDate" data-months="12">+1 Yıl</button>
              <button type="button" class="preset-chip" data-target="inputInspectionDate" data-months="6">+6 Ay</button>
              <button type="button" class="preset-chip" data-target="inputInspectionDate" data-months="24">+2 Yıl</button>
            </div>
          </div>
          <div class="leb-datepicker" data-field="inputInspectionDate">
            <button type="button" class="leb-date-trigger" id="trigger_inputInspectionDate" data-field="inputInspectionDate">
              <svg class="date-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span class="date-display-text is-placeholder" id="display_inputInspectionDate">Tarih seçin...</span>
            </button>
            <input type="hidden" id="inputInspectionDate">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <div class="label-with-presets">
              <label for="trigger_inputInsuranceDate">Sigorta Bitiş</label>
              <div class="chip-presets">
                <button type="button" class="preset-chip" data-target="inputInsuranceDate" data-months="12">+1 Yıl</button>
              </div>
            </div>
            <div class="leb-datepicker" data-field="inputInsuranceDate">
              <button type="button" class="leb-date-trigger" id="trigger_inputInsuranceDate" data-field="inputInsuranceDate">
                <svg class="date-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span class="date-display-text is-placeholder" id="display_inputInsuranceDate">Tarih seçin...</span>
              </button>
              <input type="hidden" id="inputInsuranceDate">
            </div>
          </div>
          <div class="form-group">
            <div class="label-with-presets">
              <label for="trigger_inputGreenCardDate">Yeşil Sigorta</label>
              <div class="chip-presets">
                <button type="button" class="preset-chip" data-target="inputGreenCardDate" data-months="6">+6 Ay</button>
              </div>
            </div>
            <div class="leb-datepicker" data-field="inputGreenCardDate">
              <button type="button" class="leb-date-trigger" id="trigger_inputGreenCardDate" data-field="inputGreenCardDate">
                <svg class="date-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span class="date-display-text is-placeholder" id="display_inputGreenCardDate">Tarih seçin...</span>
              </button>
              <input type="hidden" id="inputGreenCardDate">
            </div>
          </div>
        </div>

        <div class="form-row" id="rowVehicleHeavyDocs">
          <div class="form-group" id="groupRoderDate">
            <div class="label-with-presets">
              <label for="trigger_inputRoderDate">Roder Bitiş</label>
              <div class="chip-presets">
                <button type="button" class="preset-chip" data-target="inputRoderDate" data-months="12">+1 Yıl</button>
              </div>
            </div>
            <div class="leb-datepicker" data-field="inputRoderDate">
              <button type="button" class="leb-date-trigger" id="trigger_inputRoderDate" data-field="inputRoderDate">
                <svg class="date-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span class="date-display-text is-placeholder" id="display_inputRoderDate">Tarih seçin...</span>
              </button>
              <input type="hidden" id="inputRoderDate">
            </div>
          </div>
          <div class="form-group" id="groupTakoTuvDate">
            <div class="label-with-presets">
              <label for="trigger_inputTakoTuvDate">Tako Tüv Bitiş</label>
              <div class="chip-presets">
                <button type="button" class="preset-chip" data-target="inputTakoTuvDate" data-months="24">+2 Yıl</button>
              </div>
            </div>
            <div class="leb-datepicker" data-field="inputTakoTuvDate">
              <button type="button" class="leb-date-trigger" id="trigger_inputTakoTuvDate" data-field="inputTakoTuvDate">
                <svg class="date-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span class="date-display-text is-placeholder" id="display_inputTakoTuvDate">Tarih seçin...</span>
              </button>
              <input type="hidden" id="inputTakoTuvDate">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="inputVehicleNotes">Not / Randevu Durumu (Opsiyonel)</label>
          <input type="text" id="inputVehicleNotes" placeholder="Örn: Muayene randevusu alındı">
        </div>

        <div class="modal-buttons">
          <button type="button" id="cancelVehicleBtn" class="leb-btn leb-btn-secondary">İptal</button>
          <button type="submit" class="leb-btn leb-btn-primary">Kaydet</button>
        </div>
      </form>

      <!-- Driver Form (Themed & Minimalist) -->
      <form id="driverForm" class="leb-form" style="display: none;">
        <div class="form-group">
          <label for="inputDriverName">Sürücü Adı Soyadı *</label>
          <input type="text" id="inputDriverName" placeholder="Örn: Ahmet Yılmaz" required>
        </div>

        <div class="form-group">
          <div class="label-with-presets">
            <label for="trigger_inputVisaDate">Vize Bitiş Tarihi *</label>
            <div class="chip-presets">
              <button type="button" class="preset-chip" data-target="inputVisaDate" data-months="6">+6 Ay</button>
              <button type="button" class="preset-chip" data-target="inputVisaDate" data-months="12">+1 Yıl</button>
            </div>
          </div>
          <div class="leb-datepicker" data-field="inputVisaDate">
            <button type="button" class="leb-date-trigger" id="trigger_inputVisaDate" data-field="inputVisaDate">
              <svg class="date-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span class="date-display-text is-placeholder" id="display_inputVisaDate">Tarih seçin...</span>
            </button>
            <input type="hidden" id="inputVisaDate">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="inputPassport">Pasaport No</label>
            <input type="text" id="inputPassport" placeholder="Örn: U12345678">
          </div>
          <div class="form-group">
            <div class="label-with-presets">
              <label for="trigger_inputPassportDate">Pasaport Bitiş</label>
              <div class="chip-presets">
                <button type="button" class="preset-chip" data-target="inputPassportDate" data-months="12">+1 Yıl</button>
                <button type="button" class="preset-chip" data-target="inputPassportDate" data-months="60">+5 Yıl</button>
              </div>
            </div>
            <div class="leb-datepicker" data-field="inputPassportDate">
              <button type="button" class="leb-date-trigger" id="trigger_inputPassportDate" data-field="inputPassportDate">
                <svg class="date-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span class="date-display-text is-placeholder" id="display_inputPassportDate">Tarih seçin...</span>
              </button>
              <input type="hidden" id="inputPassportDate">
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="label-with-presets">
            <label for="trigger_inputLicenseDate">Ehliyet / SRC</label>
            <div class="chip-presets">
              <button type="button" class="preset-chip" data-target="inputLicenseDate" data-months="12">+1 Yıl</button>
            </div>
          </div>
          <div class="leb-datepicker" data-field="inputLicenseDate">
            <button type="button" class="leb-date-trigger" id="trigger_inputLicenseDate" data-field="inputLicenseDate">
              <svg class="date-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span class="date-display-text is-placeholder" id="display_inputLicenseDate">Tarih seçin...</span>
            </button>
            <input type="hidden" id="inputLicenseDate">
          </div>
        </div>

        <div class="form-group">
          <label for="inputDriverNotes">Not / Randevu Durumu (Opsiyonel)</label>
          <input type="text" id="inputDriverNotes" placeholder="Örn: Vize randevusu alındı">
        </div>

        <div class="modal-buttons">
          <button type="button" id="cancelDriverBtn" class="leb-btn leb-btn-secondary">İptal</button>
          <button type="submit" class="leb-btn leb-btn-primary">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DESKTOP-ONLY MODAL: Themed Tarih Güncelle Penceresi -->
  <div id="quickModal" class="leb-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="quickModalHeading">
    <div class="leb-modal-box sm-box">
      <div class="leb-modal-head">
        <h2 id="quickModalHeading" class="leb-modal-title">Tarih Güncelle</h2>
        <button id="closeQuickModalBtn" class="leb-close-btn" aria-label="Kapat">&times;</button>
      </div>

      <div class="quick-body">
        <div id="quickRecordTitle" class="quick-title-badge">34 LEB 1919</div>

        <!-- Themed Document Selector (Segmented buttons instead of select dropdown) -->
        <div class="form-group">
          <label>Güncellenecek Belge</label>
          <div class="type-segment-track" id="quickDocTypeTrack">
            <!-- Dynamically populated buttons -->
          </div>
          <input type="hidden" id="quickFieldSelect" value="inspectionDate">
        </div>

        <div class="form-group">
          <label>Hızlı Süre Ekle</label>
          <div class="presets-row">
            <button type="button" class="preset-pill" data-months="6">+6 Ay</button>
            <button type="button" class="preset-pill active" data-months="12">+1 Yıl</button>
            <button type="button" class="preset-pill" data-months="24">+2 Yıl</button>
          </div>
        </div>

        <div class="form-group">
          <label for="trigger_quickDateInput">Yeni Bitiş Tarihi</label>
          <div class="leb-datepicker" data-field="quickDateInput">
            <button type="button" class="leb-date-trigger" id="trigger_quickDateInput" data-field="quickDateInput">
              <svg class="date-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span class="date-display-text" id="display_quickDateInput">Tarih seçin...</span>
            </button>
            <input type="hidden" id="quickDateInput">
          </div>
          <div id="quickDatePreview" class="date-calculated-preview"></div>
        </div>

        <!-- Appointment / Note status (To stop daily 10 AM alerts when taken) -->
        <div class="form-group appointment-status-group">
          <label for="quickNotesInput">Randevu / Muayene Durumu</label>
          <div class="appointment-btn-row">
            <button type="button" class="preset-pill btn-quick-appointment" id="btnToggleAppointment">
              <span>✓ Randevu / Muayene Alındı</span>
            </button>
          </div>
          <input type="text" id="quickNotesInput" class="leb-input" placeholder="Örn: 15 Ekim Muayene Alındı (Opsiyonel)">
        </div>

        <div class="modal-buttons">
          <button type="button" id="cancelQuickBtn" class="leb-btn leb-btn-secondary">İptal</button>
          <button type="button" id="saveQuickBtn" class="leb-btn leb-btn-primary">Kaydet & Eşitle</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Export to Excel Modal (Clean, Categorized, Desktop Only) -->
  <div id="exportModal" class="leb-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="exportModalHeading">
    <div class="leb-modal-box export-modal-box">
      <div class="leb-modal-head">
        <h2 id="exportModalHeading" class="leb-modal-title">Excel Raporu İndir</h2>
        <button id="closeExportModalBtn" class="leb-close-btn" aria-label="Kapat">&times;</button>
      </div>
      <div class="export-modal-body">
        <p class="export-modal-desc">İndirmek istediğiniz Excel (CSV) tablosunu seçin:</p>

        <div class="export-cards-grid">
          <!-- 1. Araçlar Raporu -->
          <button type="button" class="export-card" id="btnExportVehicles">
            <div class="export-card-icon">🚛</div>
            <div class="export-card-content">
              <div class="export-card-title-row">
                <span class="export-card-title">Araçlar Listesi</span>
                <span class="export-card-pill" id="badgeExportVehicles">3 Araç</span>
              </div>
              <p class="export-card-desc">Çekici, Dorse ve Otomobil alt kategorilerine ayrılmış; Muayene, Sigorta ve Yeşil Kart süreleri.</p>
            </div>
            <span class="export-card-arrow">&rarr;</span>
          </button>

          <!-- 2. Şoförler Raporu -->
          <button type="button" class="export-card" id="btnExportDrivers">
            <div class="export-card-icon">👤</div>
            <div class="export-card-content">
              <div class="export-card-title-row">
                <span class="export-card-title">Şoförler Listesi</span>
                <span class="export-card-pill" id="badgeExportDrivers">3 Şoför</span>
              </div>
              <p class="export-card-desc">Vize bitişi, Ehliyet / SRC ve Pasaport numaralarıyla sürücü kadrosu tablosu.</p>
            </div>
            <span class="export-card-arrow">&rarr;</span>
          </button>

          <!-- 3. Tüm Filo (Birleşik Tablo) -->
          <button type="button" class="export-card" id="btnExportAll">
            <div class="export-card-icon">📑</div>
            <div class="export-card-content">
              <div class="export-card-title-row">
                <span class="export-card-title">Tüm Filo (Birleşik Tablo)</span>
                <span class="export-card-pill">Tümü</span>
              </div>
              <p class="export-card-desc">Araçlar ve şoförlerin tamamını tek bir düzenli tabloda alt alta listeler.</p>
            </div>
            <span class="export-card-arrow">&rarr;</span>
          </button>
        </div>
      </div>
      <div class="modal-buttons" style="margin-top: 16px;">
        <button type="button" id="cancelExportBtn" class="leb-btn leb-btn-secondary" style="width: 100%;">Kapat</button>
      </div>
    </div>
  </div>

  <!-- Custom Themed Calendar Popover (Replaces ugly browser datepicker completely) -->
  <div id="calBackdrop" class="cal-backdrop" style="display: none;"></div>
  <div id="lebCalendarPopover" class="leb-calendar-popover" role="dialog" aria-modal="true" style="display: none;">
    <div class="cal-header">
      <div class="cal-nav-group">
        <button type="button" class="cal-nav-btn" id="calPrevYear" title="Önceki Yıl">&laquo;</button>
        <button type="button" class="cal-nav-btn" id="calPrevMonth" title="Önceki Ay">&lsaquo;</button>
      </div>
      <div class="cal-title-container">
        <button type="button" class="cal-title-btn" id="calMonthYearTitle">Eylül 2026</button>
      </div>
      <div class="cal-nav-group">
        <button type="button" class="cal-nav-btn" id="calNextMonth" title="Sonraki Ay">&rsaquo;</button>
        <button type="button" class="cal-nav-btn" id="calNextYear" title="Sonraki Yıl">&raquo;</button>
      </div>
    </div>

    <!-- Quick Presets Bar Inside Calendar -->
    <div class="cal-presets">
      <button type="button" class="cal-preset-btn" data-preset="today">Bugün</button>
      <button type="button" class="cal-preset-btn" data-preset="6m">+6 Ay</button>
      <button type="button" class="cal-preset-btn" data-preset="1y">+1 Yıl</button>
      <button type="button" class="cal-preset-btn" data-preset="2y">+2 Yıl</button>
    </div>

    <!-- Month / Year Jump View -->
    <div class="cal-jump-view" id="calJumpView" style="display: none;">
      <div class="jump-group">
        <span class="jump-label">Ay</span>
        <div class="jump-grid" id="calJumpMonths"></div>
      </div>
      <div class="jump-group">
        <span class="jump-label">Yıl</span>
        <div class="jump-grid jump-years" id="calJumpYears"></div>
      </div>
    </div>

    <!-- Standard Days View -->
    <div class="cal-days-view" id="calDaysView">
      <div class="cal-weekdays">
        <span>Pt</span>
        <span>Sa</span>
        <span>Ça</span>
        <span>Pe</span>
        <span>Cu</span>
        <span>Ct</span>
        <span>Pa</span>
      </div>
      <div class="cal-grid" id="calDaysGrid"></div>
    </div>

    <div class="cal-footer">
      <button type="button" class="cal-footer-btn cal-btn-clear" id="calBtnClear">Temizle</button>
      <button type="button" class="cal-footer-btn cal-btn-today" id="calBtnToday">Bugün</button>
      <button type="button" class="cal-footer-btn cal-btn-done" id="calBtnDone">Kapat</button>
    </div>
  </div>

  <!-- Script v4.8.2 -->
  <script src="js/app.js?v=4.8.2"></script>
</body>
</html>
