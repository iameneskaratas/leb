<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate & Warm Gold -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18" />
      <stop offset="50%" stop-color="#2D2319" />
      <stop offset="100%" stop-color="#18130E" />
    </linearGradient>

    <!-- Golden Roasted Leblebi Chickpea Gradient -->
    <linearGradient id="leblebiGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#FFB300" />
      <stop offset="75%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>

    <!-- Chickpea Beak Highlight Gradient -->
    <linearGradient id="beakHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0" />
    </linearGradient>

    <!-- Roasted Spot Gradient -->
    <radialGradient id="roastSpotGrad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4E2608" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#6D3810" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9E531B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="roastSpotGradSmall" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3A1C05" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#5B2F0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8C4610" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow filter for chickpea -->
    <filter id="chickpeaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF8F00" flood-opacity="0.25" />
    </filter>

    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#innerGlow)" />
  <!-- Subtle warm border -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="rgba(255, 179, 0, 0.25)" stroke-width="4" />

  <!-- Main Roasted Leblebi Chickpea Character / Emblem -->
  <g filter="url(#chickpeaShadow)" transform="translate(0, -6)">
    
    <!-- Organic Chickpea Shape: rounded base with signature upper beak/notch -->
    <path d="M 248 115
             C 275 110, 310 145, 335 185
             C 365 235, 375 295, 355 350
             C 335 405, 275 428, 220 422
             C 160 415, 125 365, 130 300
             C 134 240, 168 185, 215 145
             C 230 132, 238 117, 248 115 Z"
          fill="url(#leblebiGrad)" />

    <!-- Center Cleft / Dimple Line characteristic of chickpea -->
    <path d="M 246 122
             C 236 170, 230 225, 242 285
             C 248 315, 252 345, 245 385"
          fill="none"
          stroke="#B25900"
          stroke-width="8"
          stroke-linecap="round"
          opacity="0.45" />

    <!-- Soft highlight on top left curved cheek -->
    <ellipse cx="205" cy="210" rx="38" ry="60"
             transform="rotate(-25 205 210)"
             fill="url(#beakHighlight)" />

    <!-- Characteristic Roasted Spots (Kavrulmuş Çorum Leblebisi Benekleri) -->
    <!-- Main central toast mark -->
    <circle cx="285" cy="275" r="34" fill="url(#roastSpotGrad)" />
    <!-- Secondary toast spots -->
    <circle cx="315" cy="225" r="22" fill="url(#roastSpotGradSmall)" />
    <circle cx="200" cy="335" r="28" fill="url(#roastSpotGrad)" />
    <circle cx="255" cy="360" r="18" fill="url(#roastSpotGradSmall)" />
    <circle cx="170" cy="265" r="16" fill="url(#roastSpotGradSmall)" />

  </g>
</svg>
