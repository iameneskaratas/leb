<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#5E5CE6" />
      <stop offset="100%" stop-color="#BF5AF2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- iOS App Icon Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#iosGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#innerGlow)" />
  
  <!-- Central Icon Graphic (Offline Flash / Pocket Symbol) -->
  <g filter="url(#shadow)">
    <path d="M 280 80 L 160 270 L 250 270 L 232 432 L 352 242 L 262 242 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="12" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
  </g>
</svg>
