<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Clean Light Squircle Background -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Golden Roasted Leblebi Chickpea Gradient -->
    <linearGradient id="leblebiGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Chickpea Beak Highlight -->
    <linearGradient id="beakHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0" />
    </linearGradient>

    <!-- Roasted Spot Gradients -->
    <radialGradient id="roastSpotGrad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#92400E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="roastSpotGradSmall" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#5B2508" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#78350F" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow for Chickpea on White Background -->
    <filter id="chickpeaShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean Theme-Matching Light Squircle -->
  <rect x="12" y="12" width="488" height="488" rx="118" fill="url(#lightBg)" stroke="#E2E8F0" stroke-width="18" />

  <!-- Main Roasted Leblebi Chickpea Character / Emblem -->
  <g filter="url(#chickpeaShadowLight)" transform="translate(0, -6)">
    <!-- Organic Chickpea Shape -->
    <path d="M 248 115
             C 275 110, 310 145, 335 185
             C 365 235, 375 295, 355 350
             C 335 405, 275 428, 220 422
             C 160 415, 125 365, 130 300
             C 134 240, 168 185, 215 145
             C 230 132, 238 117, 248 115 Z"
          fill="url(#leblebiGrad)" />

    <!-- Center Cleft / Dimple Line -->
    <path d="M 246 122
             C 236 170, 230 225, 242 285
             C 248 315, 252 345, 245 385"
          fill="none"
          stroke="#92400E"
          stroke-width="7"
          stroke-linecap="round"
          opacity="0.4" />

    <!-- Soft highlight on top left curved cheek -->
    <ellipse cx="205" cy="210" rx="38" ry="60"
             transform="rotate(-25 205 210)"
             fill="url(#beakHighlight)" />

    <!-- Roasted Spots (Kavrulmuş Çorum Leblebisi Benekleri) -->
    <circle cx="285" cy="275" r="32" fill="url(#roastSpotGrad)" />
    <circle cx="315" cy="225" r="20" fill="url(#roastSpotGradSmall)" />
    <circle cx="200" cy="335" r="26" fill="url(#roastSpotGrad)" />
    <circle cx="255" cy="360" r="16" fill="url(#roastSpotGradSmall)" />
    <circle cx="170" cy="265" r="15" fill="url(#roastSpotGradSmall)" />
  </g>
</svg>
