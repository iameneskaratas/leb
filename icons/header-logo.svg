<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Golden Roasted Leblebi Chickpea Gradient -->
    <linearGradient id="leblebiGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Chickpea Beak Highlight -->
    <linearGradient id="beakHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0" />
    </linearGradient>

    <!-- Roasted Spot Gradients -->
    <radialGradient id="roastSpotGrad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#92400E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="roastSpotGradSmall" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#5B2508" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#78350F" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow for Chickpea Shape -->
    <filter id="chickpeaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Pure Chickpea Emblem (Transparent Background - Zero Outer Boxes) -->
  <g filter="url(#chickpeaShadow)">
    <!-- Organic Chickpea Shape -->
    <path d="M 252 65
             C 285 58, 335 105, 365 155
             C 405 215, 420 290, 395 360
             C 370 430, 295 458, 225 450
             C 150 440, 105 380, 112 300
             C 118 225, 160 155, 218 105
             C 235 88, 242 68, 252 65 Z"
          fill="url(#leblebiGrad)" />

    <!-- Center Cleft / Dimple Line -->
    <path d="M 250 75
             C 238 135, 230 205, 245 280
             C 252 315, 256 355, 248 405"
          fill="none"
          stroke="#92400E"
          stroke-width="9"
          stroke-linecap="round"
          opacity="0.38" />

    <!-- Soft highlight on top left curved cheek -->
    <ellipse cx="205" cy="180" rx="46" ry="72"
             transform="rotate(-25 205 180)"
             fill="url(#beakHighlight)" />

    <!-- Roasted Spots (Kavrulmuş Çorum Leblebisi Benekleri) -->
    <circle cx="305" cy="265" r="38" fill="url(#roastSpotGrad)" />
    <circle cx="340" cy="205" r="24" fill="url(#roastSpotGradSmall)" />
    <circle cx="205" cy="340" r="32" fill="url(#roastSpotGrad)" />
    <circle cx="270" cy="370" r="20" fill="url(#roastSpotGradSmall)" />
    <circle cx="165" cy="250" r="18" fill="url(#roastSpotGradSmall)" />
  </g>
</svg>
